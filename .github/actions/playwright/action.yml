name: Install Playwright browsers
description: >
  `npx playwright install --with-deps`, with the browsers and the apt .deb
  files it downloads kept in the Actions cache. The slow part was never the
  browsers: it was apt fetching fonts from a slow Azure mirror. On a hit apt
  installs from the cached .debs and the browsers are already in place, so
  nothing is downloaded. Caches saved on a PR stay with that PR; the deploy
  workflow on main saves the copy every PR reads.
inputs:
  browsers:
    description: Space-separated browsers to install.
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=playwright-$ImageOS-$(npx playwright --version | cut -d' ' -f2)-${BROWSERS// /-}" >> "$GITHUB_OUTPUT"
      env:
        BROWSERS: ${{ inputs.browsers }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-debs
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: |
        mkdir -p ~/.cache/playwright-debs
        sudo cp ~/.cache/playwright-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        npx playwright install --with-deps $BROWSERS
        cp /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/ 2>/dev/null || true
        du -sh ~/.cache/ms-playwright ~/.cache/playwright-debs
      env:
        BROWSERS: ${{ inputs.browsers }}
