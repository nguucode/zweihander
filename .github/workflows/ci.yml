name: CI

# The same checks the deploy runs, on the PR, so a red build is caught before
# it lands on main instead of after.
on:
  pull_request:
    branches: [main]
  # Visual baselines starts this after it commits new screenshots.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status compares against origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx changeset status --since=origin/main
      - run: npm run tokens:check
      - run: npm run registry:check
      - run: npm run playground:check
      - run: npm run lint:css
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx tsc -b
      - run: npx vitest --project storybook run
      - run: npx vitest --project visual run
      # A mismatch writes the actual screenshot and a diff beside each other.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: .vitest-attachments
          if-no-files-found: ignore
      - run: npm run build:lib
