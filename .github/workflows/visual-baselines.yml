name: Visual baselines

# Screenshots only compare reliably on the machine that made them, so the
# baselines in src/__screenshots__/ are made here, on the same runner CI
# compares on, never on a Mac. Add the `update screenshots` label to a PR
# whose visual change is intended: this job re-takes every screenshot,
# commits the ones that changed to the PR branch, removes the label and
# starts CI again on the new commit.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  update:
    if: github.event.label.name == 'update screenshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest --project visual run --update
      - name: Commit changed baselines
        run: |
          git add src/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "Update visual baselines"
          git push -q origin "HEAD:${{ github.head_ref }}"
          # A push made with GITHUB_TOKEN starts no workflow, so start CI on
          # the new commit by hand.
          gh workflow run ci.yml --ref "${{ github.head_ref }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "update screenshots"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
