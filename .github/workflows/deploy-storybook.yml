name: Deploy docs site, Storybook & registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zweihander.ontheshore.biz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if a generated file was hand-edited, or if a ramp was changed so
      # that an accent can no longer carry a readable label.
      - run: npm run tokens:check
      # The copy-source path has no build step on our side, so a registry item
      # that ships an unresolvable import only fails in someone else's repo.
      - run: npm run registry:check
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - run: npx vitest --project storybook run
      # Verifies the npm package still builds; output isn't published here
      # (that's a separate, explicit `npm publish` step).
      - run: npm run build:lib
      # Docs home at /, Storybook at /storybook/, shadcn-CLI registry at /r/<name>.json
      # so consumers can run `npx shadcn add https://zweihander.ontheshore.biz/r/button.json`.
      - run: npm run build:site
      - name: Publish build to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
      # zweihander.ontheshore.biz: this repo's own GitHub Pages site (custom
      # domain set in repo settings, CNAME record in Cloudflare DNS).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      # Fine-grained PAT scoped to nguucode/ontheshore, Actions: read and write.
      - run: gh workflow run deploy.yml --repo nguucode/ontheshore
        env:
          GH_TOKEN: ${{ secrets.ONTHESHORE_DISPATCH_TOKEN }}
